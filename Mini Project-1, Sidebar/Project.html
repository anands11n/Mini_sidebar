<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mainbox">
        <input type="checkbox" id="check">
        <div class="btn_one">
            <label for="check">
                <i class="fa-solid fa-bars" style="color: white"></i>
            </label>
        </div>

        <div class="main_side_bar">
            <div class="apna_clg">
                <a href="#apnaclg">Camera Store</a> 
                <div class="cross"><label for="check"><i class="fa-solid fa-xmark"></i></label></div>
            </div>
            <div class="menu">
                <div id="galary" class="sh">
                    <i class="fa-solid fa-image"></i> &nbsp;&nbsp;
                    <a href="#">Gallery</a>
                </div>

                <div id="shortcuts" class="sh">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> &nbsp;&nbsp;
                    <a href="#">Shortcuts</a>
                </div>

                <div id="exhibits" class="sh">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>&nbsp;&nbsp;
                    <a href="#">Exhibits</a>
                </div>

                <div id="events" class="sh">
                    <i class="fa-solid fa-calendar-days"></i>&nbsp;&nbsp;
                    <a href="#">Events</a>
                </div>

                <div id="store" class="sh">
                    <i class="fa-solid fa-store"></i>&nbsp;&nbsp;
                    <a href="#">Store</a>
                </div>


                <div id="contact" class="sh">
                    <i class="fa-solid fa-phone"></i>&nbsp;&nbsp;
                    <a href="#">Contact</a>
                </div>

                <div id="feedback" class="sh">
                    <i class="fa-regular fa-comments"></i>&nbsp;&nbsp;
                    <a href="#">Feedback</a>
                </div>
            </div>

            <div class="foot">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>



        </div>
    </div>
</body>
</html>
